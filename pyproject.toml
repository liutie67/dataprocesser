[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataprocesser"
version = "1.0.0"
description = "Personal data processor."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.4.3",
    "fastapi>=0.116.0",
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "pillow>=12.1.0",
    "pycryptodome>=3.23.0",
    "tqdm>=4.67.1",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx2>=1.0.0",
    "pytest>=8.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["video_crypt", "video_preview", "command_builder"]
exclude = ["**/*.aes", "**/__pycache__", "**/.DS_Store"]
